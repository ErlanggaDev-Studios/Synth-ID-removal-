[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthid-cleaner"
version = "1.1.0"
description = "CLI untuk membersihkan metadata dan watermark tak terlihat dari gambar hasil AI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["image", "metadata", "exif", "watermark", "synthid", "cli", "pillow"]
dependencies = ["Pillow>=10.0,<13"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
synthid-clean = "synthid_removal.cli:run_cli"

[tool.setuptools]
packages = ["synthid_removal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
